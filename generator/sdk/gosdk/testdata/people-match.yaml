                    $ref: '#/components/schemas/ErrorDetails'
                  message:
                    deprecated: true
                    description: Legacy error field. Removed on 2027-02-16, after which `error_details` is the only error payload.
                    type: string
                    example: The maximum number of api calls allowed for api/v1/people/match is 600 times per hour. Please upgrade your plan from https://app.apollo.io/#/settings/plans/upgrade.
      deprecated: false
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: |-
        [Recommended] API key, passed in the `x-api-key` request header.
        See [Create API Keys](https://docs.apollo.io/docs/create-api-key).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        OAuth 2.0 access token, used by Apollo partners building integrations.
        See the [OAuth 2.0 authorization flow](https://docs.apollo.io/docs/use-oauth-20-authorization-flow-to-access-apollo-user-information-partners).
  schemas:
    ErrorDetails:
      type: object
      description: Machine-readable detail for an error that uses the new format, returned alongside the endpoint's existing error fields. The legacy error fields at the root level (`error`, `error_code`, `message`, etc) are removed on 2027-02-16, after which `error_details` is the only error payload. Some errors already return `error_details` on its own.
      properties:
        code:
          type: string
          description: Stable identifier in the form `DOMAIN.CATEGORY.REASON`. Branch on this value; the human-readable `message` can change.
          example: AUTH.AUTHENTICATION.CREDENTIALS_MISSING
        message:
          type: string
          description: Human-readable explanation of what went wrong.
          example: This request carried no credential Apollo could authenticate.
        suggestions:
          type: array
          description: Ordered, actionable next steps. Each entry carries a `label`, and where relevant the `parameter`, `header`, or `url` it refers to.
          items:
            type: object
            properties:
              label:
                type: string
                example: Send your API key in the X-Api-Key header
              url:
                type: string
                example: https://docs.apollo.io/reference/authentication
              parameter:
                type: string
                example: webhook_url
              parameters:
                type: array
                description: Several parameters, any one of which satisfies the requirement.
                items:
                  type: string
                example:
                - name
                - domain
                - website_url
                - linkedin_url
              header:
                type: string
                example: X-Api-Key
              example:
                type: string
                description: A valid sample value for the parameter named above.
              retry_after_seconds:
                type: integer
                description: On a rate-limit refusal, how long to wait before retrying.
                example: 60
        context:
          type: object
          description: Values from your request that explain the refusal. Each entry is an object rather than a bare value, so read `context.<key>.value`. Absent when the error needs no context.
          additionalProperties:
            type: object
            properties:
              value:
                type: string
              description:
                type: string
          example:
            window:
              value: hourly
              description: The rate-limit window your request exceeded
